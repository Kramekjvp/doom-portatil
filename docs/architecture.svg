<svg width="680" height="512" viewBox="0 0 680 512" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Arquitetura do console Doom portátil</title>
<desc>Botões e bateria alimentam o ESP32, que se comunica por serial UART com a Raspberry Pi, que por sua vez envia saída para tela e áudio.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<g fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5">
<rect x="150" y="40" width="160" height="56" rx="8"/>
</g>
<text x="230" y="58" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Botões</text>
<text x="230" y="76" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">D-pad + 2 ações</text>

<g fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5">
<rect x="370" y="40" width="160" height="56" rx="8"/>
</g>
<text x="450" y="58" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Bateria</text>
<text x="450" y="76" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">Leitura via ADC</text>

<line x1="230" y1="96" x2="250" y2="170" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="450" y1="96" x2="430" y2="170" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5">
<rect x="190" y="170" width="300" height="56" rx="8"/>
</g>
<text x="340" y="188" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">ESP32 (microcontrolador)</text>
<text x="340" y="206" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">I/O, bateria, shutdown seguro</text>

<line x1="340" y1="226" x2="340" y2="300" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="352" y="266" text-anchor="start" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">Serial (UART)</text>

<g fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5">
<rect x="180" y="300" width="320" height="56" rx="8"/>
</g>
<text x="340" y="318" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">Raspberry Pi</text>
<text x="340" y="336" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0C447C">doomgeneric + daemon uinput</text>

<line x1="260" y1="356" x2="220" y2="416" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="420" y1="356" x2="460" y2="416" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5">
<rect x="130" y="416" width="180" height="56" rx="8"/>
</g>
<text x="220" y="434" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Tela</text>
<text x="220" y="452" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">A definir: SPI/HDMI</text>

<g fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5">
<rect x="370" y="416" width="180" height="56" rx="8"/>
</g>
<text x="460" y="434" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Áudio</text>
<text x="460" y="452" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">Opcional no MVP</text>
</svg>
